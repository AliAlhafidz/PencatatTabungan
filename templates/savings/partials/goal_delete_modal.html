<div id="active-modal" 
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm transition-opacity"
     x-data>

    <!-- Backdrop Click to Close -->
    <div class="fixed inset-0 anim-fade" @click="$dispatch('closeModal')"></div>

    <!-- Confirmation Modal Card -->
    <div class="relative w-full max-w-sm bg-surface-container rounded-3xl p-6 border border-outline-variant/30 shadow-2xl z-10 space-y-5 anim-modal -translate-y-2 sm:translate-y-0 text-center">
        
        <!-- Warning Icon -->
        <div class="w-14 h-14 mx-auto rounded-3xl bg-error/15 text-error flex items-center justify-center border border-error/20">
            <span class="material-symbols-rounded text-3xl">delete_forever</span>
        </div>

        <!-- Text Description -->
        <div class="space-y-2">
            <h3 class="text-lg font-black text-apptext tracking-tight">Hapus Target Tabungan?</h3>
            <p class="text-xs text-outline leading-relaxed">
                Target <strong class="text-apptext font-bold">"{{ goal.name }}"</strong> beserta seluruh riwayat transaksinya akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.
            </p>
        </div>

        <!-- Actions Form -->
        <form action="{% url 'goal_delete' goal.pk %}" method="post" class="space-y-2.5 pt-2">
            {% csrf_token %}
            <button type="submit" 
                    class="w-full py-3 px-4 rounded-2xl bg-error hover:bg-error/90 text-white font-extrabold text-xs shadow-lg shadow-error/25 transition-all touch-bounce flex items-center justify-center gap-1.5">
                <span class="material-symbols-rounded text-base">delete</span>
                Ya, Hapus Sekarang
            </button>
            <button type="button" 
                    @click="$dispatch('closeModal')" 
                    class="w-full py-2.5 px-4 rounded-2xl bg-surface-container-high hover:bg-surface-container-highest text-outline hover:text-apptext font-bold text-xs transition-colors border border-outline-variant/30">
                Batal
            </button>
        </form>

    </div>
</div>
